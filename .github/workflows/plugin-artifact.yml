name: Prisma Minecraft Plugin Artifact
on:
  push:
    branches: [main, rebuild/prisma-v3]
    paths:
      - "minecraft-plugin/**"
      - "packages/contracts/minecraft-commands.json"
      - "modules/registry.json"
      - "VERSION"
      - ".github/workflows/plugin-artifact.yml"
  workflow_dispatch:

concurrency:
  group: prisma-plugin-artifact-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build PrismaPlugin 2.1.0
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Setup Gradle 9.4.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.4.0"

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          test "$VERSION" = "2.1.0"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: minecraft-plugin
        run: gradle clean build --no-daemon

      - name: Verify
        shell: pwsh
        run: |
          $jar = "minecraft-plugin/build/libs/PrismaPlugin-${{ steps.version.outputs.version }}.jar"
          if (-not (Test-Path $jar)) { throw "JAR not found: $jar" }
          & jar tf $jar | Select-String '^plugin.yml$' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "plugin.yml not found inside JAR" }
          Get-Item $jar | Format-Table Name,Length

      - name: Upload JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PrismaPlugin-${{ steps.version.outputs.version }}
          path: minecraft-plugin/build/libs/PrismaPlugin-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error
