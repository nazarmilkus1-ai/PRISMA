name: PRISMA participant site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/participant-site.yml"
  workflow_dispatch:

concurrency:
  group: prisma-participant-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 15
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee /tmp/prisma-site-install.log

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/prisma-site-typecheck.log

      - name: Build
        id: build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/prisma-site-build.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo "=== npm version ==="
            npm --version
            echo "=== node version ==="
            node --version
            echo "=== install ==="
            cat /tmp/prisma-site-install.log 2>/dev/null || true
            echo "=== typecheck ==="
            cat /tmp/prisma-site-typecheck.log 2>/dev/null || true
            echo "=== build ==="
            cat /tmp/prisma-site-build.log 2>/dev/null || true
          } > /tmp/prisma-site-build-diagnostics.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prisma-site-build-diagnostics
          path: /tmp/prisma-site-build-diagnostics.txt
          if-no-files-found: error

      - name: Fail when build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1